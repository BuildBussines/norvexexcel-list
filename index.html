<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NorvexManagement · Multi-Project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<body>
    <div class="app" id="app">
        <!-- ─── PROJECT BAR ─── -->
        <div class="project-bar" id="projectBar">
            <span class="logo"><i class="fas fa-layer-group"></i> Norvex</span>
            <div class="project-tabs" id="projectTabs"></div>
            <div class="project-bar-actions">
                <button id="addProjectBtn" class="primary" title="New project"><i class="fas fa-plus"></i> Project</button>
                <button id="renameProjectBtn" title="Rename project"><i class="fas fa-pen"></i></button>
                <button id="deleteProjectBtn" class="danger" title="Delete project"><i class="fas fa-trash"></i></button>
            </div>
        </div>

        <!-- ─── HEADER ─── -->
        <header class="header">
            <div class="header-left">
                <div class="title-wrapper">
                    <input type="text" id="sheetTitle" value="Website Data" placeholder="Sheet title…" />
                    <button class="edit-title-btn" id="editTitleBtn" title="Edit title"><i class="fas fa-pen"></i></button>
                </div>
            </div>
            <div class="header-actions">
                <span class="connection-status" id="connectionStatus">
                    <span class="dot connecting" id="connectionDot"></span>
                    <span id="connectionText">Connecting...</span>
                </span>
                <button class="theme-toggle" id="themeToggle" title="Toggle theme"><i class="fas fa-moon"></i></button>
                <button class="settings-btn" id="settingsBtn" title="Settings"><i class="fas fa-cog"></i></button>
                <button id="saveToSupabaseBtn" class="save-btn" title="Save all data to Supabase"><i class="fas fa-cloud-upload-alt"></i> Save to Cloud</button>
                <button id="resetDataBtn" class="danger"><i class="fas fa-undo-alt"></i> Reset</button>
                <button id="exportCsvBtn" class="success"><i class="fas fa-file-csv"></i> CSV</button>
                <button id="importCsvBtn" class="primary"><i class="fas fa-upload"></i> Import</button>
                <input type="file" id="csvFileInput" accept=".csv" style="display:none" />
            </div>
        </header>

        <!-- ─── TOOLBAR ─── -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search rows…" />
            </div>
            <div class="btn-group">
                <button id="addRowBtn" class="primary"><i class="fas fa-plus"></i> Add Row</button>
                <button id="addColBtn"><i class="fas fa-columns"></i> Add Column</button>
                <button id="addHeaderBtn" class="primary"><i class="fas fa-heading"></i> H</button>
                <button id="clearAllBtn" class="danger"><i class="fas fa-trash-alt"></i> Clear All</button>
            </div>
        </div>

        <!-- ─── TABLE ─── -->
        <div class="table-wrapper">
            <div class="table-scroll">
                <table id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="footer-status">
                <span><span class="count" id="rowCount">0</span> rows</span>
                <span class="save-status">
                    <span id="saveStatusText">Ready</span>
                    <span class="save-indicator saved" id="saveIndicator"></span>
                </span>
                <span id="lastUpdated">Ready</span>
            </div>
        </div>
    </div>

    <!-- ─── MODAL (generic) ─── -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <h2 id="modalTitle">Add Row</h2>
            <p class="sub" id="modalSub">Fill in the fields below.</p>
            <div class="modal-scroll" id="modalScroll">
                <div id="modalBody"></div>
            </div>
            <div class="modal-actions">
                <button id="modalCancelBtn">Cancel</button>
                <button id="modalConfirmBtn" class="primary">Save</button>
            </div>
        </div>
    </div>

    <!-- ─── TOAST ─── -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
